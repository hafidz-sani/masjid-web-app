<script src="js/main.js"></script>
<script>
(function(){
 var root='data.json';
 window.fetchMasjidData=function(){try{var r=fetch(root);return r.then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json()})}catch(e){console.warn('[API]',e.message);return null}};
 var qsAll=function(s){return document.querySelectorAll(s)};
 var qs=function(s,p){return(p||document).querySelector(s)};
 var burger=qs('.hamburger'),drawer=qs('.drawer'),overlay=qs('.drawer-overlay');
 if(burger)burger.addEventListener('click',function(){this.classList.toggle('open');drawer.classList.toggle('open');overlay.classList.toggle('show')});
 if(overlay)overlay.addEventListener('click',function(){burger.classList.remove('open');drawer.classList.remove('open');overlay.classList.remove('show')});
 qsAll('.drawer a').forEach(function(a){a.addEventListener('click',function(){burger.classList.remove('open');drawer.classList.remove('open');overlay.classList.remove('show')})});
 var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}})},{threshold:0.12});
 qsAll('.reveal').forEach(function(el,i){el.style.transitionDelay=(i*0.06)+'s';io.observe(el)});

 function render(data){
  var el=document.getElementById('donasi-content');if(!el||!data.donasi)return;
  var d=data.donasi;
  var out='';

  if (d.qris) {
   out += '<div class="card donasi-card">'
    + '<h3>QRIS</h3>'
    + '<p style="color:var(--text-secondary)">'+d.qris.nama+'</p>'
    + '<div style="width:200px;height:200px;margin:16px auto;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,0.05);">'
    + '<span class="caption">(QRIS)</span></div>'
    + '<p class="caption">Donasi minimal: '+d.qris.nominal_saran+'</p>'
    + '</div>';
  }

  if (d.bank && d.bank.length) {
   out += '<div class="donasi-grid mt-xl" style="grid-template-columns:repeat(' + Math.min(d.bank.length,3) + ',1fr);">';
   d.bank.forEach(function(b){
    out += '<div class="card donasi-card text-left">'
     + '<h3 class="donasi-amount">Transfer</h3>'
     + '<p class="caption">'+b.bank+' · '+b.cabang+'</p>'
     + '<div class="account">'+b.norek+'</div>'
     + '<p class="caption">a.n. '+b.an+'</p>'
     + '</div>';
   });
   out += '</div>';
  }

  if (d.laporan) {
   out += '<div class="card mt-xl">'
    + '<h3 class="donasi-amount" style="font-size:16px;margin-bottom:22px">Laporan Keuangan · '+d.laporan.bulan+'</h3>'
    + '<div class="donasi-grid" style="text-align:left">'
    + '<div><p class="caption">Total Masuk</p><p class="donasi-amount">'+d.laporan.total_masuk+'</p></div>'
    + '<div><p class="caption">Total Keluar</p><p class="donasi-amount">'+d.laporan.total_keluar+'</p></div>'
    + '<div><p class="caption">Sisa</p><p class="donasi-amount">'+d.laporan.sisa+'</p></div>'
    + '</div></div>';
  }

  el.innerHTML = out;
 }

 document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('year').textContent = new Date().getFullYear();
  fetchMasjidData().then(render);
 });
})();
</script>
