<script src="js/main.js"></script>
<script>
(function(){
 var root='data.json';
 window.fetchMasjidData=function(){try{var r=fetch(root);return r.then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json()})}catch(e){console.warn('[API]',e.message);return null}};
 var qsAll=function(s){return document.querySelectorAll(s)};
 var qs=function(s,p){return(p||document).querySelector(s)};
 var burger=qs('.hamburger'),drawer=qs('.drawer'),overlay=qs('.drawer-overlay');
 if(burger)burger.addEventListener('click',function(){this.classList.toggle('open');drawer.classList.toggle('open');overlay.classList.toggle('show')});
 if(overlay)overlay.addEventListener('click',function(){burger.classList.remove('open');drawer.classList.remove('open');overlay.classList.remove('show')});
 qsAll('.drawer a').forEach(function(a){a.addEventListener('click',function(){burger.classList.remove('open');drawer.classList.remove('open');overlay.classList.remove('show')})});
 var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}})},{threshold:0.12});
 qsAll('.reveal').forEach(function(el,i){el.style.transitionDelay=(i*0.06)+'s';io.observe(el)});

 function render(data){
  var el=document.getElementById('kontak-content');if(!el||!data.kontak)return;
  var k=data.kontak;
  var items = [
   {icon:'📍',label:'Alamat',text:k.alamat},
   {icon:'📞',label:'Telepon',text:k.telepon},
   {icon:'💬',label:'WhatsApp',text:'Chat via WhatsApp',link:'https://wa.me/'+k.whatsapp.replace('+','')},
   {icon:'✉️',label:'Email',text:k.email,link:'mailto:'+k.email}
  ];
  var out='<div class="kontak-grid"><div>';
  out+='<h3 style="font-size:20px;font-weight:600;margin-bottom:20px">Informasi Kontak</h3>';
  items.forEach(function(it){
   out+='<div class="contact-item mb-md">'
    +'<div class="contact-icon">'+it.icon+'</div>'
    +'<div><h4>'+it.label+'</h4>'
    +(it.link?'<p><a href="'+it.link+'" target="_blank" style="color:var(--text-primary);text-decoration:underline;">'+it.text+'</a></p>'
     :'<p>'+it.text+'</p>')
    +'</div></div>';
  });
  out+='<div class="mt-xl"><h3 style="font-size:16px;font-weight:600;margin-bottom:14px">Jam Operasional</h3>';
  if(k.jam_operasional){
   var jam=k.jam_operasional;
   [{l:'Ibadah',v:'5 waktu sholat'},{l:'Kantor',v:jam.kantor},{l:'TPQ',v:jam.tpq}].forEach(function(j){
    if(j.v) out+='<div class="contact-item mb-sm"><div class="contact-icon">🕐</div><div><h4>'+j.l+'</h4><p>'+j.v+'</p></div></div>';
   });
  }
  out+='</div></div>';

  // form
  out+='<div><div class="card"><h3 style="font-size:18px;font-weight:600;margin-bottom:18px">Kirim Pesan</h3>'
   +'<form onsubmit="event.preventDefault();alert(\'Pesan terkirim (demo)!\');">'
   +'<div class="form-group"><label class="form-label">Nama</label><input type="text" class="form-input" placeholder="Nama lengkap"></div>'
   +'<div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" placeholder="email@example.com"></div>'
   +'<div class="form-group"><label class="form-label">Pesan</label><textarea class="form-textarea" placeholder="Tulis pesan..."></textarea></div>'
   +'<button type="submit" class="btn btn-primary" style="width:100%">Kirim</button></form></div></div>';

  el.innerHTML=out;
 }

 document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('year').textContent=new Date().getFullYear();
  fetchMasjidData().then(render);
 });
})();
</script>
